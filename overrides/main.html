{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <!-- Primary Meta -->
  <meta name="robots" content="index, follow">
  <meta property="og:site_name" content="DoTheyGoBad">
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@dotheygobad">
  
  <!-- Schema.org WebSite -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "DoTheyGoBad",
    "url": "https://dotheygobad.com",
    "description": "Food Shelf Life Science Encyclopedia",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://dotheygobad.com/search/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  
  <!-- Schema.org Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "DoTheyGoBad",
    "url": "https://dotheygobad.com",
    "description": "Industrial food science encyclopedia explaining food spoilage mechanisms"
  }
  </script>
{% endblock %}
