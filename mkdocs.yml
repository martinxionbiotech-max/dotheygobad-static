site_name: DoTheyGoBad — Food Shelf Life Science Encyclopedia
site_url: https://dotheygobad.com/
site_description: Industrial food science encyclopedia explaining why foods spoil, how shelf life is determined, and what preservation methods work — from chemistry, microbiology, and processing engineering.
repo_url: https://github.com/martinxionbiotech-max/dotheygobad-static
edit_uri: edit/main/docs/

extra_css:
  - assets/stylesheets/extra.css

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: default
    primary: deep orange
    accent: amber
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.tabs.link

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.emoji
  - toc:
      permalink: true

plugins:
  - search

extra:
  generator: false
  analytics:
    provider: google
    property: G-XXXXXXXXXX

hooks:
  - overrides/sitemap_hooks.py

nav:
  - Home: index.md
  - Categories:
      - categories/index.md
      - Beer & Alcoholic Drinks: categories/beer-alcoholic-drinks.md
      - Dairy Products: categories/dairy-products.md
      - Fruits & Vegetables: categories/fruits-vegetables.md
      - Grains & Baked Goods: categories/grains-baked-goods.md
      - Meat & Seafood: categories/meat-seafood.md
      - Non-Alcoholic Beverages: categories/non-alcoholic-beverages.md
      - Sauces & Condiments: categories/sauces-condiments.md
      - Food Industry Concepts: categories/food-industry-concept.md
  - All Articles: articles.md
  - Tools:
      - tools-dotheygobad.md
      - NRV Calculator: nrv-calculator.md
      - Water Safety Calculator: water-safety-risk-calculator.md
  - Resources:
      - resources.md
      - resource-llms-txt.md
  - Glossary: food-science-glossary.md
  - FAQ: faq.md
  - Editorial Principles: editorial-principles.md
  - About:
      - about/index.md
      - Author Profile: about/author-profile.md
  - Contact: contact.md
  - HTML Sitemap: html-sitemap.md
  - Legal:
      - Privacy Policy: legal/privacy-policy.md
      - Terms of Use: legal/terms-of-use.md
      - Disclaimer: legal/disclaimer.md
